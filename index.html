<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neuromuscular Fellowship Portal</title>
    <meta name="theme-color" content="#0E7C86" />
    <script>
      /* Before anything renders. React mounting first would show a white page
         to a dark-mode user for one frame, which is the flash every themed app
         is judged by. Kept inline and tiny for the same reason. */
      (function () {
        try {
          var c = localStorage.getItem('nmf-theme') || 'system'
          var dark = c === 'dark' || (c === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#0D1117')
          }
        } catch (e) {}
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NM Fellowship" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    </script>
  </body>
</html>
